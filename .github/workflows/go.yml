name: Go build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this revision (main production; other branches require preview_pr)
        type: boolean
        default: false
      preview_pr:
        description: Open same-repository PR number for a manual preview
        type: string

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb

      - name: Start virtual display
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        env:
          DISPLAY: :99
        run: go test -coverprofile coverage.out -covermode atomic ./...

      - name: Generate coverage reports
        run: |
          go tool cover -func coverage.out | tee coverage-summary.txt
          go tool cover -html coverage.out -o coverage.html
          {
            echo "## Go Coverage"
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt
            coverage.html
          if-no-files-found: error

  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            binary: build/tower-defense-linux-amd64
          - os: windows-latest
            artifact: windows-amd64
            binary: build/tower-defense-windows-amd64.exe
          - os: macos-15
            artifact: darwin-arm64
            binary: build/tower-defense-darwin-arm64
          - os: macos-15-intel
            artifact: darwin-amd64
            binary: build/tower-defense-darwin-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb

      - name: Start virtual display
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          DISPLAY: :99
        run: go test ./...

      - name: Create build directory
        run: mkdir -p build
        shell: bash

      - name: Build binary
        run: go build -v -o ${{ matrix.binary }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tower-defense-${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  browser:
    name: Browser (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test browser storage fallback
        run: node scripts/test-browser-storage.mjs
      - name: Test Pages packaging
        run: node --test scripts/package-pages.test.mjs scripts/pages-target.test.mjs
      - name: Build browser bundle
        run: go run ./cmd/web
      - name: Package versioned Pages assets
        run: node scripts/package-pages.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: tower-defense-web
          path: build/pages
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy Cloudflare Pages
    needs: [coverage, build, browser]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-tower-defense-go
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: tower-defense-web
          path: build/pages
      - name: Validate project and publish static bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/deploy-pages.mjs
